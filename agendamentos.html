            <div class="form-header">
                <h1>Cadastro de Pacientes</h1>
            </div>

            <form id="patientForm" action="agendar.php" method="post">
                <div class="input-group">
                    <div class="input-boxbox">
                        <label for="nome">Nome Completo:</label>
                        <input type="text" id="nome" name="nomecompleto" placeholder="Digite seu nome completo" required>
                    </div>

                    <div class="input-boxbox">
                        <label for="cpf">CPF:</label>
                        <input type="text" id="cpf" name="cpf" placeholder="Digite seu CPF" required>
                    </div>

                    <div class="input-boxbox">
                        <label for="telefone">Telefone:</label>
                        <input type="tel" id="telefone" name="telefone" placeholder="(xx) xxxx-xxxx" required>
                    </div>

                    <div class="input-boxbox">
                        <label for="sus-inss">Possui SUS ou INSS?</label>
                        <select id="sus-inss" name="sus-inss" required>
                            <option value="" disabled selected>Selecione</option>
                            <option value="sus">SUS</option>
                            <option value="inss">INSS</option>
                            <option value="nenhum">Nenhum</option>
                        </select>
                    </div>

                    <div class="input-boxbox">
                        <label for="sintomas">Descreva os sintomas:</label>
                        <textarea id="sintoma" name="sintomas" rows="5" placeholder="Escreva seus sintomas aqui..." required></textarea>
                    </div>

                    <div class="input-boxbox">
                        <label for="ambulancia">Precisa de ambulância?</label>
                        <select id="ambulancia" name="ambulancia" required>
                            <option value="" disabled selected>Selecione</option>
                            <option value="Sim">Sim</option>
                            <option value="Não">Não</option>
                        </select>
                    </div>
                </div>

                <div class="continue-button">
                    <button type="submit">Continuar</button>
                </div>
            </form>

    <!--Vlibras-->

      <script>
        document.addEventListener('DOMContentLoaded', function () {
            const darkModeToggle = document.getElementById('darkModeToggle');
            darkModeToggle.addEventListener('click', function () {
                document.body.classList.toggle('dark-mode');
            });
        });
      </script>
      <!--Vlibras-->

    <!-- Modal de confirmação -->
    <div class="overlay"></div>
    <div class="confirmation-modal">
        <div class="check-icon">✔</div>
        <h2>Formulário enviado com sucesso!</h2>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
    const form = document.querySelector('form');
    const modal = document.querySelector('.confirmation-modal');
    const overlay = document.querySelector('.overlay');

    form.addEventListener('submit', function (event) {
        event.preventDefault(); 

        const formData = new FormData(form);

        fetch('agendar.php', {
            method: 'POST',
            body: formData
        })
        .then(response => {
            if (response.ok) {
                modal.style.display = 'block';
                overlay.style.display = 'block';

                setTimeout(() => {
                    modal.style.display = 'none';
                    overlay.style.display = 'none';
                    form.reset();
                }, 3000);
            } else {
                alert('Erro ao enviar o formulário. Tente novamente.');
            }
        })
        .catch(error => {
            console.error('Erro:', error);
            alert('Erro ao processar o formulário.');
        });
    });
});
    </script>
